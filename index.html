<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線上白板功能測試</title>
<style>
:root{--bg:#f2f5fa;--ink:#1f2328;--sub:#5f6670;--line:#d3dbe8;--acc:#2f5fd0;--accbg:#e9effd;--card:#fff;--dot:#d2dae8;--warn:#e8f1fc;--warnl:#9dbce6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer}
.ic{width:100%;height:100%;display:block}
.page{max-width:760px;margin:0 auto;padding:48px 24px}
.page h1{font-size:24px;margin:0 0 16px}
.page p{margin:0 0 14px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 22px}
.btn:disabled{background:#b9c2d6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.links a{display:inline-block;margin:0 10px 10px 0;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-decoration:none}
/* task screen */
#task{display:none;height:100%;flex-direction:column}
#top{min-height:128px;display:flex;flex-direction:column;justify-content:center;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px}
#top .meta{font-size:13px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
#top .lead{font-size:14px;color:var(--sub)}
#top .q{font-size:20px;font-weight:600;margin-top:4px}
#hint{display:none;background:var(--warn);border-bottom:1px solid var(--warnl);padding:10px 24px;align-items:center;gap:16px}
#hint span{flex:1}
#canvas{flex:1;position:relative;overflow:hidden;background-color:#f6f9fd;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px}
#tool{position:absolute;left:16px;top:16px;width:64px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 2px 6px rgba(0,0,0,.06);text-align:center}
#plus{width:40px;height:40px;border:0;border-radius:8px;background:#fff;font-size:26px;line-height:1;color:var(--ink)}
#plus:hover,#plus.on{background:var(--accbg);color:var(--acc)}
#tool small{display:block;white-space:nowrap;font-size:11px;color:var(--sub);margin-top:2px}
#panel{display:none;position:absolute;left:92px;top:16px;width:440px;height:min(600px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);flex-direction:column;overflow:hidden}
#phead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;min-height:50px}
#phead .back{border:0;background:none;color:var(--acc);padding:2px 6px}
#pbody{flex:1;overflow:auto;padding:10px}
#pfoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:84px}
#pfoot .info{flex:1;font-size:14px;color:var(--sub)}
#pfoot .info b{color:var(--ink)}
.cat{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 16px;margin-bottom:10px;font-size:17px}
.cat:hover{border-color:var(--acc);background:var(--accbg)}
.fn{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.fn.sel{border-color:var(--acc);background:var(--accbg)}
.fn .row{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.fn .icb{width:32px;height:32px;flex:none;color:var(--ink)}
.fn .nm{flex:1;font-size:16px;line-height:1.3}
.fn .nm .d{display:block;font-size:13.5px;color:var(--sub);margin-top:0;line-height:1.35}
.fn .i{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--sub);background:#fff;color:var(--sub);font-size:14px;line-height:1;font-family:Georgia,serif}
.fn .i.open{background:var(--ink);color:#fff;border-color:var(--ink)}
.fn .xd{padding:0 12px 10px 56px;margin-top:-6px;font-size:13.5px;line-height:1.35;color:var(--sub)}
.wrong{color:#b3261e;font-size:14px}
#debug{position:fixed;right:12px;top:130px;background:#111;color:#eee;font:12px/1.5 ui-monospace,monospace;padding:8px 10px;border-radius:8px;z-index:9;display:none}
#debug button{font-size:11px;margin-top:4px}

#fake{position:absolute;inset:0;pointer-events:none;user-select:none;overflow:hidden}
#fake .a{position:absolute;color:#3b3f45}
#fake .h{font-size:30px;font-weight:700}
#fake .g{font-size:14px;color:#8a8f98}
#fake .bar{height:10px;border-radius:5px;background:#d6d8dc;margin-bottom:10px}
#fake .bx{width:130px;height:64px;border:2px solid #4b5563;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
#fake .cur{position:absolute}
#fake .cur span{position:absolute;left:16px;top:16px;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
#fake .sel{outline:1.5px solid #4a6cf0;outline-offset:6px}
#fake .sel i{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid #4a6cf0;border-radius:2px;box-sizing:border-box}
#fake .edt{outline:1.5px dashed #4a6cf0;outline-offset:5px;background:#fff}
#fake .n.edt{color:#555;font-style:normal}
#fake .hl{background:#bcd3ff}
#fake .cr{display:inline-block;width:1.5px;height:1.1em;background:#222;vertical-align:-3px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#fake .t{font-size:18px}
#fake .n{font-size:15px;color:#9aa0a8;font-style:italic}
.ph{width:40px;height:40px;border:1.5px dashed #aab4c6;border-radius:8px;margin:0 auto 6px}
#btool{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:4px;pointer-events:none;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.06)}
#btool div{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#3b3f45}
#btool svg{width:22px;height:22px}
#zoom{position:absolute;right:16px;bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:14px;pointer-events:none;user-select:none;color:#3b3f45;box-shadow:0 2px 6px rgba(0,0,0,.06);font-size:15px}
#zoom b{font-weight:400;font-size:20px;line-height:1}
#pointer{display:none;position:absolute;align-items:center;gap:8px;z-index:3;pointer-events:none}
#pointer svg{width:44px;height:28px;animation:nudge 1.1s ease-in-out infinite}
#pointer .callout{background:#1f2328;color:#fff;border-radius:8px;padding:8px 14px;font-size:15px;white-space:nowrap}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
.fq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.fq h3{margin:0 0 6px;font-size:17px}
.fq .zh{margin:0 0 4px}.fq .en{margin:0 0 14px;color:var(--sub);font-size:14px}
.sl{position:relative;margin-top:26px;height:34px;touch-action:none;cursor:pointer;margin:0 8px}
.sl .ln{position:absolute;left:0;right:0;top:16px;height:2px;background:#9aa0a8}
.sl .tk{position:absolute;top:8px;width:2px;height:18px;background:#9aa0a8}
.sl .th{position:absolute;top:5px;width:6px;height:24px;margin-left:-3px;background:var(--acc);border-radius:3px;display:none}
.sl.on .th{display:block}
.sl .st{position:absolute;top:12px;width:1px;height:8px;background:#c4c8ce}
.sl .bb{position:absolute;top:-24px;transform:translateX(-50%);background:#1f2328;color:#fff;font-size:13px;line-height:1;padding:4px 8px;border-radius:6px;display:none;white-space:nowrap}
.sl.on .bb{display:block}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin:2px 8px 0}
.likert{display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.likert label{flex:1;text-align:center;font-size:14px;color:var(--sub);cursor:pointer}
.likert input{display:block;margin:0 auto 4px;width:18px;height:18px}
.opt{display:flex;align-items:flex-start;gap:8px;padding:4px 0;cursor:pointer}.opt input{margin-top:5px}.opt small{color:var(--sub);font-size:13px}
.txt{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.en2{color:var(--sub);font-size:14px}
.gi{display:block;width:100%;max-width:340px;margin-top:8px}ol.steps li{margin-bottom:24px}ol.steps li:last-child{margin-bottom:0}.steps{margin:0;padding-left:22px}.steps li{margin-bottom:6px}
.likert .le{display:block;font-style:normal;font-size:13px;line-height:1.3;margin-top:4px;color:var(--sub)}
.likert .ends2{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:2px}
.note{font-size:14px;color:var(--sub)}
#obj{position:absolute;left:0;right:0;top:0;bottom:120px;padding-left:0;pointer-events:none;user-select:none;display:none;align-items:center;justify-content:flex-start}
.ob{display:flex;flex-direction:column;position:relative;flex:none}
.tb{display:flex;align-items:center;gap:2px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.13);color:#2b2f36}
.tb .ti{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px}
.tb .sp{width:1px;height:26px;background:#e6e8ec;margin:0 6px}
.tb .sw{display:inline-block;width:26px;height:26px;border-radius:50%;margin:0 5px;box-sizing:border-box}
.pl{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:#4a8bf0;font-size:22px}
.hd{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #9aa0a8;box-sizing:border-box}
.hd.sq{border-radius:3px;width:12px;height:12px;border-color:#4a8bf0;margin:0}
.hdp{display:inline-flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:8px 16px;box-shadow:0 2px 8px rgba(0,0,0,.1);font-size:20px;color:#1f2328}
.cd{background:#fff;overflow:visible;padding-top:40px}
.cm{display:flex;gap:20px;padding:14px 18px;color:#444;height:40px;align-items:center;position:absolute;top:0;left:0;z-index:1}
.gr{display:grid}
.gr>span{display:flex;align-items:center;gap:5px;white-space:nowrap}.gr>span:first-child{justify-content:center}.hdp>span,.hdp>b{display:inline-flex;align-items:center}.hdp b{font-weight:600}
.bar{position:absolute;height:34px;border:1.5px solid #cdb24a;background:#fdf4b3;border-radius:9px;display:flex;align-items:center;padding-left:12px;color:#5b4d10;font-size:13.5px}
#donebar{display:none;position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:5;background:#1f2328;color:#fff;border-radius:12px;padding:14px 18px;align-items:center;gap:18px;box-shadow:0 8px 24px rgba(0,0,0,.25);width:680px;max-width:92%}
#donebar .btn{background:#fff;color:#1f2328;white-space:nowrap}
textarea{width:100%;height:260px;font:12px ui-monospace,monospace}
</style>
</head>
<body>
<div id="entry" class="page" style="display:none"></div>
<div id="intro" class="page" style="display:none"></div>
<div id="between" class="page" style="display:none"></div>
<div id="form" class="page" style="display:none"></div>
<div id="end" class="page" style="display:none"></div>
<div id="task">
  <div id="top"><div class="meta"><span id="pg"></span></div><div class="lead" id="lead"></div><div class="q" id="q"></div></div>
  <div id="hint"><span id="hintx"></span><button class="btn ghost" id="hintok">知道了</button></div>
  <div id="canvas">
<div id="fake" aria-hidden="true"></div>
    <div id="tool"><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><button id="plus" aria-label="更多功能">＋</button><small>更多功能</small></div>
    <div id="btool" aria-hidden="true"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l13 7.5-5.8 1.6L10 18z"/></svg></div><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg></div></div>
    <div id="zoom" aria-hidden="true"><b>−</b><span>100%</span><b>＋</b></div>
    <div id="pointer"><svg viewBox="0 0 44 28" fill="none" stroke="#2f5fd0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M42 14H4M14 4L4 14l10 10"/></svg><div class="callout">看完題目後，點擊「更多功能」開始任務</div></div>
    <div id="obj"></div>
    <div id="donebar"><span><b style="display:block;font-size:17px;margin-bottom:2px">你已選到這題要找的功能，本題計時到此停止。</b>畫面上顯示的是你選的功能。請點擊「確認」，填寫本題的工作負荷量表。</span><button class="btn" id="doneok">確認</button></div>
    <div id="panel"><div id="phead"></div><div id="pbody"></div><div id="pfoot"></div></div>
  </div>
</div>
<div id="debug"></div>
<script>

  };
  const exclusive=n=>document.querySelectorAll(`input[name=${n}]`).forEach(e=>e.addEventListener('change',()=>{
    if(!e.checked)return;
    const never=e.value===NONE;
    document.querySelectorAll(`input[name=${n}]`).forEach(o=>{if(o!==e&&(never||o.value===NONE))o.checked=false});
  }));
  exclusive('plat');exclusive('ctx');
  const check=()=>{
    const v=vals();
    $('platOther').style.display=v.platforms.includes('其他')?'block':'none';
    $('ctxOther').style.display=v.contexts.includes('其他')?'block':'none';

  /* 第 5 題與第 6、7 題連動：選「沒有使用過任何協作白板」→ 第 6 題自動為「從未使用」、第 7 題自動為「沒有使用過…」；若選了任何平台 → 第 6、7 題不能選「從未使用／沒有使用過…」 */
  let autoSet=false;
  const NEVER='從未使用';
  const sync=()=>{
    const pl=[...document.querySelectorAll('input[name=plat]:checked')].map(e=>e.value);
    const none=pl.includes(NONE),other=pl.length>0&&!none;
    const apply=(n,key)=>document.querySelectorAll(`input[name=${n}]`).forEach(e=>{
      const isNone=e.value===key,lab=e.closest('label');
      if(none){e.checked=isNone;e.disabled=!isNone}

    });
    apply('freq',NEVER);apply('ctx',NONE);
    autoSet=none;
    check();
  };

    body.innerHTML='';

      if(PRES==='3'){
        const i=document.createElement('button');i.className='i'+(S.info[id]?' open':'');i.textContent='i';i.setAttribute('aria-label','說明');
        i.onclick=e=>{e.stopPropagation();S.info[id]=!S.info[id];log('info_click',{fn:id,open:!!S.info[id]});render()};
        row.appendChild(i);
      }
      row.onclick=()=>{S.sel=id;log('select_fn',{fn:id,cat:c.name});render()};
      d.appendChild(row);
      if((PRES==='3'&&S.info[id])||(PRES==='2'&&S.sel===id)){const x=document.createElement('div');x.className='xd';x.textContent=f.desc;d.appendChild(x)}

    });

function openCat(c){
  S.layer=3;S.cat=c;S.sel=null;S.info={};S.wrong=false;
  S.lastOpened=c.name;S.opened.push(c.name);
  log('open_cat',{cat:c.name});render();
}
function confirm(){
  const id=S.sel;if(!id)return;
  const ok=id===S.task.target;
  const rec={fn:id,cat:catOf(id),ok,t:now()};
  S.confirms.push(rec);S.lastCat=rec.cat;
  log('confirm',{fn:id,cat:rec.cat,ok});
  if(ok){finishTask();return}
  S.errors++;S.wrong=true;S.sel=null;render();
  checkHints();dbg();
}
function tick(){if(S.t0===null||S.done)return;checkHints();dbg()}
function checkHints(){
  if(S.t0===null||S.done)return;
  const el=now();
  if(!S.hint[1]&&(S.errors>=E_H1||el>=T_H1)){showHint(1,HINT1)}
  else if(S.hint[1]&&!S.hint[2]&&(S.errors>E_H2||el>T_H2)){
    const ref=S.confirms.length?S.lastCat:(S.lastOpened||null);
    const tc=catOf(S.task.target);
    let tx;
    if(!ref)tx=HINT1;
    else if(ref===tc)tx=`提示：這題要找的功能就在「${tc}」這個類別裡，請再看看這個類別的其他功能。`;
    else tx=`提示：「${ref}」這個類別裡沒有這題要找的功能，請看看其他類別。`;
    showHint(2,tx,ref);
  }
}
function showHint(l,tx,ref){S.hint[l]=now();$('hintx').textContent=tx;$('hint').style.display='flex';log('hint_shown',{level:l,ref:ref||null,errors:S.errors})}
$('hintok').onclick=()=>{$('hint').style.display='none';log('hint_dismiss')};

/* 迷失度 L（Smith, 1996）：N=開過的不同節點（類別＋確認過的功能），S=節點總造訪次數（含重複），R=最短路徑 2 */
function calcLost(){
  const dn=new Set(S.opened).size+new Set(S.confirms.map(c=>c.fn)).size;
  const tot=S.opened.length+S.confirms.length,R=2;
  if(!dn||!tot)return null;
  return Math.round(Math.sqrt(Math.pow(dn/tot-1,2)+Math.pow(R/dn-1,2))*1000)/1000;
}
function summarize(){
  const T=S.task,tc=catOf(T.target),fc=S.confirms[0]||null;
  return{task:T.id,target:T.target,targetCat:tc,totalMs:now(),errors:S.errors,
    firstConfirm:fc?{fn:fc.fn,cat:fc.cat,ok:fc.ok,ms:fc.t}:null,
    firstFnCorrect:fc?fc.ok:null,firstCatCorrect:fc?fc.cat===tc:null,
    firstOpenedCat:S.opened[0]||null,firstOpenedCatCorrect:S.opened.length?S.opened[0]===tc:null,
    catOpens:S.opened.length,distinctCats:new Set(S.opened).size,
    distinctConfirmFns:new Set(S.confirms.map(c=>c.fn)).size,lostness:calcLost(),
    backs:S.ev.filter(e=>e.type==='back').length,infoClicks:S.ev.filter(e=>e.type==='info_click'&&e.open).length,
    hint1Ms:S.hint[1],hint2Ms:S.hint[2],hinted:!!S.hint[1],events:S.ev};
}

function showComplete(){
  $('panel').style.display='none';$('plus').classList.remove('on');$('hint').style.display='none';
  const cv=$('canvas'),fk=$('fake'),ob=$('obj');
  ob.innerHTML=OBJ[S.task.target]||'';ob.style.display='flex';ob.style.transition='none';ob.style.transform='';ob.style.paddingLeft='0';
  $('donebar').style.display='flex';
  /* 新物件放在畫布上現有內容的右側，並把畫布往左平移，讓兩者同時進入視野 */
  const cr=cv.getBoundingClientRect(),W=cr.width;let R=0;
  fk.querySelectorAll('.a,.cur').forEach(e=>{R=Math.max(R,e.getBoundingClientRect().right-cr.left)});
  const w=ob.firstElementChild.getBoundingClientRect().width,g=84;
  if(S.task.target==='F07'||S.task.target==='F05'){/* 小物件：直接放在同一畫面的左側空白處，不需平移 */
    const L=Math.max(90,90+((W*.45-90)-w)/2);ob.style.paddingLeft=L+'px';return finishShow();}
  ob.style.paddingLeft=(R+g)+'px';
  let D=Math.max(160,R+g+w-(W-28));D=Math.min(D,Math.max(160,R-150));
  const tr='transform .9s cubic-bezier(.4,0,.2,1) .35s';
  void ob.offsetWidth;
  fk.style.transition=tr;ob.style.transition=tr;cv.style.transition='background-position .9s cubic-bezier(.4,0,.2,1) .35s';
  fk.style.transform=ob.style.transform='translateX('+(-D)+'px)';cv.style.backgroundPosition=(-D)+'px 0';
  finishShow();
  function finishShow(){const t0=Date.now();
    $('doneok').onclick=()=>{session.tasks[ti].completeScreenMs=Date.now()-t0;tlxPage()};
  }
}
function finishTask(){
  S.done=true;clearInterval(timer);$('pointer').style.display='none';log('task_done');
  $('panel').style.display='none';$('plus').classList.remove('on');$('hint').style.display='none';
  session.tasks.push(summarize());
  showComplete();
}
const INT_SUB=[
 ["功能的分類方式","How functions were grouped into categories"],
 ["圖示、名稱、說明文字","Icons, names, and descriptions"],
 ["尋找功能的過程","The process of searching for functions"],
 ["其他（不屬於以上項目的，請在此補充）","Other (anything not covered above)"]
];
const INT_PARTS=[
 {k:"pros",zh:"你覺得這個平台有哪些優點？哪些地方讓你覺得順手、容易找到功能？",en:"What did you like about this platform? What made it easy to find functions?",hint:"可就下列項目填寫，有想到的才需要寫。"},
 {k:"cons",zh:"你覺得有哪些缺點？哪些地方讓你覺得困難、困惑、容易選錯，或曾經卡住？",en:"What did you dislike? What was difficult, confusing, easy to get wrong, or made you feel stuck?",hint:"可就下列項目填寫，有想到的才需要寫；若有想改進的地方也歡迎一併寫下。"}
];
function interviewPage(){
  const t0=Date.now();show('form');
  /* 回顧：每題若「第一次打開的類別不對」或「確認過不是該題要找的功能」，就列出並請受測者描述當時的想法 */
  const WR=[];/* {ti,kind:'cat'|'fn',name,fn?} */
  (session.tasks||[]).forEach((t,ti)=>{
    if(t.firstOpenedCatCorrect===false&&t.firstOpenedCat)WR.push({ti,kind:'cat',name:t.firstOpenedCat});
    const seen=[];(t.events||[]).filter(e=>e.type==='confirm'&&!e.ok).forEach(e=>{if(!seen.includes(e.fn))seen.push(e.fn)});
    seen.forEach(fn=>WR.push({ti,kind:'fn',fn,name:fmap[fn].name}));
  });
  let h='<h1>使用感想</h1><p>最後是幾個開放式問題，請依照你的實際感受，用自己的話寫下來，沒有標準答案。標示 * 的題目為必填，其他為選填。</p>';
  let q=1;
  if(WR.length){
    h+=`<div class="fq"><p class="zh" style="margin:0">${q++}. 回顧你做題時的選擇 *</p><p class="en">下面是你做題時，一開始沒有直接找對的地方。請回想當時的情況，寫下你為什麼會這樣選、當時是怎麼想的。如果不記得了，請寫「不記得」。</p>`;
    let lastTi=-1;
    WR.forEach((w,wi)=>{
      const T=session.tasks[w.ti],tf=fmap[T.target];
      if(w.ti!==lastTi){
        h+=`<div style="margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line)"><p class="zh" style="margin:0 0 8px"><b>第 ${w.ti+1} 題</b>：${TASKS[w.ti].text}</p><div style="display:flex;align-items:center;gap:10px"><div class="icb" style="width:30px;height:30px;flex:none;color:var(--ink)">${ICONS[tf.icon]}</div><span>這題要找的功能是「<b>${tf.name}</b>」，在「${T.targetCat}」類別裡。</span></div></div>`;
        lastTi=w.ti;
      }
      if(w.kind==='cat')h+=`<p class="zh" style="margin:12px 0 4px;font-size:15px">你一開始打開了「<b>${w.name}</b>」類別。</p>`;
      else{const f=fmap[w.fn];h+=`<div style="display:flex;align-items:center;gap:10px;margin:12px 0 4px"><div class="icb" style="width:30px;height:30px;flex:none;color:var(--ink)">${ICONS[f.icon]}</div><span>你選過「<b>${f.name}</b>」。</span></div>`}
      h+=`<textarea class="txt" id="rv_${wi}" rows="2" style="width:100%;resize:vertical;min-height:0;height:64px" placeholder="當時你為什麼${w.kind==='cat'?'打開這個類別':'選這個功能'}？"></textarea>`;
    });
    h+='</div>';
  }
  h+=`<div class="fq"><p class="zh" style="margin:0 0 8px">${q++}. 你覺得這個平台有哪些優點？哪些地方讓你覺得順手、容易找到功能？ *</p><textarea class="txt" id="int_pros" rows="5" style="width:100%;resize:vertical;height:120px" placeholder="例如：功能的分類方式、圖示、名稱、說明文字、尋找功能的過程…（有想到的才需要寫）"></textarea></div>`;
  h+=`<div class="fq"><p class="zh" style="margin:0 0 8px">${q++}. 你覺得有哪些缺點？哪些地方讓你覺得困難、困惑、容易選錯，或曾經卡住？也歡迎寫下想改進的地方。 *</p><textarea class="txt" id="int_cons" rows="5" style="width:100%;resize:vertical;height:120px" placeholder="例如：功能的分類方式、圖示、名稱、說明文字、尋找功能的過程…（有想到的才需要寫）"></textarea></div>`;
  h+=`<div class="fq"><p class="zh" style="margin:0 0 8px">${q++}. 整體來說，你覺得這個測試平台用起來的感想如何？（選填）</p><textarea class="txt" id="int_all" rows="4" style="width:100%;resize:vertical;height:100px"></textarea></div>`;
  h+='<button class="btn" id="isub" disabled>送出</button>';
  $('form').innerHTML=h;window.scrollTo(0,0);
  const v=id=>$(id).value.trim();
  const chk=()=>{$('isub').disabled=!(v('int_pros')&&v('int_cons')&&WR.every((_,wi)=>v('rv_'+wi)))};
  $('form').oninput=chk;
  $('isub').onclick=()=>{
    session.interview={pros:v('int_pros'),cons:v('int_cons'),overall:v('int_all')};
    session.interview.review=WR.map((w,wi)=>({task:session.tasks[w.ti].task,no:w.ti+1,kind:w.kind,name:w.name,fn:w.fn||null,a:v('rv_'+wi)}));
    session.interviewMs=Date.now()-t0;$('form').oninput=null;endPage();
  };
}
function endPage(){
  show('end');session.finishedAt=Date.now();
  const js=JSON.stringify(session,null,1);
  $('end').innerHTML='<h1>測試結束</h1><p id="est">'+(ENDPOINT?'正在送出資料，請稍候，先不要關閉頁面……':'（尚未設定資料接收網址，目前只在本機顯示結果。）')+'</p><p><button class="btn" id="retry" style="display:none">重新送出</button> <button class="btn ghost" id="dl" style="display:none">下載結果 JSON</button></p><textarea id="out" readonly style="display:none"></textarea>';
  $('out').value=js;
  $('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'application/json'}));a.download=`result_${PID}_${COND}.json`;a.click()};
  const fail=()=>{$('est').innerHTML='資料送出失敗。請確認網路連線後按「重新送出」；若仍失敗，請按「下載結果 JSON」並將檔案傳給研究者。';$('retry').style.display='';$('dl').style.display=''};
  const send=()=>{
    if(!ENDPOINT){$('dl').style.display='';$('out').style.display='block';return}
    $('est').textContent='正在送出資料，請稍候，先不要關閉頁面……';$('retry').style.display='none';
    fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(session)})
      .then(()=>{$('est').textContent='資料已送出，感謝你的參與！可以關閉這個頁面了。';session.submitted=true})
      .catch(fail);
  };
  $('retry').onclick=send;send();
}
function dbg(){
  if(!DEBUG||!S)return;const d=$('debug');d.style.display='block';
  d.innerHTML=`cond ${COND} / ${PID}<br>target ${S.task.target} ${fmap[S.task.target].name}（${catOf(S.task.target)}）<br>errors ${S.errors}　elapsed ${(now()/1000).toFixed(0)}s<br>hint1 ${S.hint[1]!==null}　hint2 ${S.hint[2]!==null}<br><button id="dskip">跳過本題</button>`;
  $('dskip').onclick=()=>{if(S.t0===null)S.t0=Date.now();finishTask()};
}
if(!valid)entryPage();else studyPage();
</script>
